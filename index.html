<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nexoo Agency — Le digital, mis en mouvement</title>
    <meta
      name="description"
      content="Nexoo Agency — studio créatif digital. Direction artistique, motion design et expériences web sur mesure."
    />
    <meta name="theme-color" content="#0A0A0B" />

    <!-- Fonts start fetching before the bundle is even parsed.
         Archivo is requested WITH its wdth axis (62–125): the loader's
         whole gesture is that axis opening. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Critical paint: the first frame the browser can show is already
         the loader's ground colour, so there is no white flash and no
         visible boundary when React and the Player take over. -->
    <style>
      html, body { margin: 0; background: #0a0a0b; }
      #root { min-height: 100svh; }

      /* Pre-intro. Painted from the HTML, so it is on screen in the first
         frame — before React, before the Player's bundle, before the
         typefaces. Without it the viewer gets ~1.5s of pure black while
         the JS boots, and the intro that follows reads as "nothing
         happened, then the site appeared".

         Deliberately a hairline and NOT a dot: the loader opens on the
         red dot at the masthead's position, and a second dot centred
         somewhere else would have to cross-fade across the screen. A
         rule is already part of the vocabulary and collides with
         nothing. */
      #preintro {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 200;
        height: 1px;
        background: #26262a;
        transition: opacity 260ms linear;
      }
      #preintro i {
        display: block;
        height: 100%;
        width: 100%;
        background: #e8362b;
        transform-origin: left center;
        animation: preintro 1.6s cubic-bezier(0.65, 0, 0.32, 1) infinite;
      }
      #preintro[data-done='true'] { opacity: 0; }

      @keyframes preintro {
        0%   { transform: scaleX(0); }
        60%  { transform: scaleX(1); }
        100% { transform: scaleX(1); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        #preintro i { animation: none; transform: scaleX(1); opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="preintro" aria-hidden="true"><i></i></div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 32px; color: #f2f0ec; font-family: system-ui, sans-serif">
        <h1 style="font-size: 40px; margin: 0 0 8px">Nexoo Agency</h1>
        <p>Le digital, mis en mouvement. Activez JavaScript pour découvrir le studio.</p>
      </div>
    </noscript>
    <script type="module" src="/site/main.tsx"></script>
  </body>
</html>
