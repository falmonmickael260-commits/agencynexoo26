name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the permissions Pages actually needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck and lint
        run: npm run lint

      - name: Build
        # Project pages are served from /<repo>/, so every asset URL
        # needs that prefix. Taken from the repo name rather than
        # hardcoded, so a rename does not silently break the build.
        run: SITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run site:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
